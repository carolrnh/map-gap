<form method="post" action="{{ url_for('lookup_post') }}" class="retry-form lookup-form">
  <label for="q-again">Try it a different way</label>
  <input id="q-again" name="q" type="text" required autocomplete="off"
         value="{{ retry_q }}"
         placeholder="Business name, City — or a Google Maps link">
  <button class="btn" type="submit">Check again</button>
  <p class="hint">Paste the link from Google Maps → Share → Copy link, or type the business name and city.</p>
</form>
