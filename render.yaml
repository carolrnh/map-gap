services:
  - type: web
    name: map-gap
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    # CANONICAL_HOST is intentionally absent. shopvsshop.com DNS is not live.
    # Set it in the Render dashboard (value: shopvsshop.com) only after the
    # domain resolves. /health stays exempt in the app.
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: MAPGAP_HOST
        value: "0.0.0.0"
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: USE_GOOGLE_PLACES
        value: "false"
      - key: PLACES_DAILY_CAP
        value: "150"
